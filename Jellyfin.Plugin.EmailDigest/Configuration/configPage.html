<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Email Digest</title>
</head>
<body>
    <div id="EmailDigestConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="EmailDigestConfigForm">
                    <div class="verticalSection">
                        <h2>Email Digest</h2>
                        <p>
                            This is a Phase 1 skeleton page. SMTP, digest scheduling and
                            per-user notification preferences will appear here in later
                            phases of development.
                        </p>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var EmailDigestConfig = {
                pluginUniqueId: '0e2dad96-d957-4026-8abb-0ca78068c5f0'
            };

            document.querySelector('#EmailDigestConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(EmailDigestConfig.pluginUniqueId).then(function (config) {
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#EmailDigestConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(EmailDigestConfig.pluginUniqueId).then(function (config) {
                        ApiClient.updatePluginConfiguration(EmailDigestConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
